<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>
            Choose your time
        </title>
        <link rel="icon" href="images/favicon.ico"/>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi"
            crossorigin="anonymous"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&family=Newsreader:ital@0;1&display=swap"
            rel="stylesheet"
        />
        <link 
            rel="stylesheet" 
            href="main.css"
        />
        <link
            rel="stylesheet" 
            href="times.css"
        />
    </head>
    <body>
        <header>
            <nav>
            <a href="tutors.html" class="back-link">tutors</a>
            <a href="login.html" class="btn btn-outline-secondary rounded-pill ms-auto">Login/Register</a>
            </nav>
        </header>
        <main>
            <!-- This message below saying "with Ben 1 hour", will be dynamic and based on the tutor and the amount of time selected -->
            <p class="booking-summary">With Ben 1 hour</p>
            <h1>Select a <span class="title-italics">time</span></h1>
            <ul class="day-list">
                <li>
                    <button type="button" class="day-pill" aria-pressed="true">Mon <span>22</span></button>
                </li>
                <li>
                    <button type="button" class="day-pill" aria-pressed="false">Tue <span>23</span></button>
                </li>
                <li>
                    <button type="button" class="day-pill" aria-pressed="false">Wed <span>24</span></button>
                </li>
                <li>
                    <button type="button" class="day-pill" aria-pressed="false">Thu <span>25</span></button>
                </li>
                <li>
                    <button type="button" class="day-pill" aria-pressed="false">Fri <span>26</span></button>
                </li>
            </ul>
            <h2 class="day-header">Monday, September 22</h2>
            <p class="open-count">4 times open</p>
            <!-- DATABASE DATA PLACEHOLDER. All of these times will be eventually available times for the tutor that are fetched from the database. -->
            <ul class="slot-list">
                <li>
                    <button type="button" class="slot">9:00 AM</button>
                </li>
                <li>
                    <p class="slot-taken"><s>Taken 10:00 AM</s></p>
                    <!-- IMPORTANT: WEBSOCKETPLACEHOLDER. When one user books an appointment at a time it will update for all users. -->
                </li>
                <li>
                    <button type="button" class="slot">11:00 AM</button>
                </li>
                <li>
                    <button type="button" class="slot">3:00 PM</button>
                </li>
                <li>
                    <button type="button" class="slot">4:00 PM</button>
                </li>
            </ul>
            <div class="alert alert-success alert-dismissible text-start payment-complete" role="status">
                <p class="paid-success-color">Monday, September 22 at 9:00 AM</p>
                <p class="tutor-contact-message">60 minutes with Ben</p>
                <a href="info.html" class="btn btn-primary rounded-pill book-button-space">Continue</a>
                <!-- This eventually won't be present all of the time, but is a dynamic message that will appear at the bottom after a time is selected. -->
            </div>
        
        </main>
        <footer>
            <p>Ben Myers</p>
            <a href="https://github.com/TheBen2005/startup">Ben's Github</a>
        </footer>

    </body>


</html>
