<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>
            Sign up
        </title>
        <link rel="icon" href="images/favicon.ico"/>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi"
            crossorigin="anonymous"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&family=Newsreader:ital@0;1&display=swap"
            rel="stylesheet"
        />
        <link 
            rel="stylesheet" 
            href="main.css"
        />
        <link
            rel="stylesheet" 
            href="signup.css"
        />
    </head>
    <body>
        <header>
            <nav>
            <a href="index.html" class="back-link">home</a>
            </nav>
        </header>
        <main>
            <h1>Create your <span class="title-italics">account</span></h1>
            <p class="intro-text">Sign up with first name, last name, email and password.</p>
            <form method="get" action="index.html">
                <div>
                <label for="firstName" class="form-label">First name</label>
                <input type="text" placeholder="Ben" id="firstName" name="firstName" class="form-control" />
                </div>
                <div>
                <label for="lastName" class="form-label">Last name</label>
                <input type="text" placeholder="Myers" id="lastName" name="lastName" class="form-control" />
                </div>
                <div>
                <label for="email" class="form-label">Email address</label>
                <input type="email" placeholder="example.email@outlook.com" id="email" name="email" class="form-control"/>
                </div>
                <div>
                <label for="password" class="form-label">Password</label>
                <input type="password" placeholder="********" id="password" name="password" class="form-control"/>
                </div>
                <button type="submit" class="btn btn-primary btn-lg rounded-pill book-button-space w-100">Sign Up</button>
            </form>
            <p class="have-account"> Already have an account?<span><a href="login.html" class="log-in-link"> Login</a></span></p>
        
        </main>
        <footer>
            <p>Ben Myers</p>
            <a href="https://github.com/TheBen2005/startup">Ben's Github</a>
        </footer>

    </body>


</html>
