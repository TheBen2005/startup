<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>
            Sign up
        </title>
        <link rel="icon" href="images/favicon.ico"/>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi"
            crossorigin="anonymous"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&family=Newsreader:ital@0;1&display=swap"
            rel="stylesheet"
        />
        <link 
            rel="stylesheet" 
            href="main.css"
        />
        <link
            rel="stylesheet" 
            href="signup.css"
        />
    </head>
    <body>
        <header>
            <nav>
            <a href="index.html" class="back-link">home</a>
            </nav>
        </header>
        <main>
            <h1>Create your <span>account</span></h1>
            <p>Sign up with first name, last name, email and password.</p>
            <form method="get" action="index.html">
                <div>
                <label for="firstName">First name</label>
                <input type="text" placeholder="Ben" id="firstName" name="firstName" />
                </div>
                <div>
                <label for="lastName">Last name</label>
                <input type="text" placeholder="Myers" id="lastName" name="lastName" />
                </div>
                <div>
                <label for="email">Email address</label>
                <input type="email" placeholder="example.email@outlook.com" id="email" name="email"/>
                </div>
                <div>
                <label for="password">Password</label>
                <input type="password" placeholder="********" id="password" name="password"/>
                </div>
                <button type="submit">Sign Up</button>
            </form>
            <p>Already have an account?</p>
            <a href="login.html">Login</a>
        
        </main>
        <footer>
            <p>Ben Myers</p>
            <a href="https://github.com/TheBen2005/startup">Ben's Github</a>
        </footer>

    </body>


</html>
