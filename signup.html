<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>
            Sign up
        </title>
        <link rel="icon" href="images/favicon.ico"/>
    </head>
    <body>
        <header>
            <nav>
            <a href="index.html">Home</a>
            </nav>
        </header>
        <main>
            <h1>Create your <span>account</span></h1>
            <p>Sign up with first name, last name, email and password.</p>
            <form method="get" action="index.html">
                <div>
                <label for="firstName">First name</label>
                <input type="text" placeholder="Ben" id="firstName" name="firstName" />
                </div>
                <div>
                <label for="lastName">Last name</label>
                <input type="text" placeholder="Myers" id="lastName" name="lastName" />
                </div>
                <div>
                <label for="email">Email address</label>
                <input type="email" placeholder="example.email@outlook.com" id="email" name="email"/>
                </div>
                <div>
                <label for="password">Password</label>
                <input type="password" placeholder="********" id="password" name="password"/>
                </div>
                <button type="submit">Sign Up</button>
            </form>
            <p>Already have an account?</p>
            <a href="login.html">Login</a>
        
        </main>
        <footer>
            <p>Ben Myers</p>
            <a href="https://github.com/TheBen2005/startup">Ben's Github</a>
        </footer>

    </body>


</html>
