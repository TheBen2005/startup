    <head>

    <body>
        <header>
            <nav>
                <details>
                    <summary>Ben</summary>
                    <ul>
                        <li>
                            <a href="index.html">Home</a>
                        </li>
                        <li>
                            <button type="submit">Log out</button>
                        </li>
                
                    </ul>
                </details>
            </nav>
            <!-- IMPORTANT. This is the page that I, the tutor will only have access too. I will be authenticated and will have access to edit my times. The name displayed in the top is currentlly hard coded to be Ben but will be dynamic based on the information the user logged in with. Non-tutors will be logged in and returned to the home page while authenticated tutors are taken to this page. After loggin in, both the tutors and the users can click their name in the top and log out -->
        </header>
        <main>
            <!-- IMPORTANT. When the tutor updates times, that infrmation is updated in the database and reflected on users screens when they are choosing times for a tutor in real time. Also, when a user books a time that infromation is updated in the database and displayed on this page -->
            <h1>Set my <span class="title-italics">availability</span></h1>
            <p class="intro-text">Tap a time to open or close it. Students only see the times you leave open.</p>
            <ul class="day-list">
                <li>
                    <button type="button" class="day-pill" aria-pressed="true">Mon <span>22</span></button>
                </li>
                <li>
                    <button type="button" class="day-pill" aria-pressed="false">Tue <span>23</span></button>
                </li>
                <li>
                    <button type="button" class="day-pill" aria-pressed="false">Wed <span>24</span></button>
                </li>
                <li>
                    <button type="button" class="day-pill" aria-pressed="false">Thu <span>25</span></button>
                </li>
                <li>
                    <button type="button" class="day-pill" aria-pressed="false">Fri <span>26</span></button>
                </li>
            </ul>
            <h2 class="day-header">Monday, September 22</h2>
            <p class="open-count">4 times open 1 booked</p>
            <ul class="slot-list">
                <li>
                    <button type="button" class="slot">8:00 AM<span> Closed</span></button>
                </li>
                <li>
                    <button type="button" class="slot">9:00 AM<span> Open</span></button>
                </li>
                <li>
                    <p class="slot-taken"><s>10:00AM</s> booked Jordan L</p>
                </li>
                <li>
                    <button type="button" class="slot">11:00 AM<span> Open</span></button>
                </li>
                <li>
                    <button type="button" class="slot">12:00 PM<span> Closed</span></button>
                </li>
                <li>
                    <button type="button" class="slot">1:00 PM<span> Closed</span></button>
                </li>
                <li>
                    <button type="button" class="slot">2:00 PM<span> Closed</span></button>
                </li>
                <li>
                    <button type="button" class="slot">3:00 PM<span> Open</span></button>
                </li>
                <li>
                    <button type="button" class="slot">4:00 PM<span> Open</span></button>
                </li>
                <li>
                    <button type="button" class="slot">5:00 PM<span> Closed</span></button>
                </li>
                <li>
                    <button type="button" class="slot">6:00 PM<span> Closed</span></button>
                </li>
                <li>
                    <button type="button" class="slot">7:00 PM<span> Closed</span></button>
                </li>
                <li>
                    <button type="button" class="slot">8:00 PM<span> Closed</span></button>
                </li>
            </ul>
            <button class="btn btn-primary rounded-pill book-button-space">Save</button>
        
        </main>
        <footer>
            <p>Ben Myers</p>
            <a href="https://github.com/TheBen2005/startup">Ben's Github</a>
        </footer>

    </body>
