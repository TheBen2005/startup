<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>
            Login
        </title>
        <link rel="icon" href="images/favicon.ico"/>
    </head>
    <body>
        <header>
            <nav>
            <a href="index.html">Home</a>
            </nav>
        </header>
        <main>
            <h1>Welcome <span>back</span></h1>
            <p>Log in with your email and password.</p>
            <form method="get" action="setavailability.html">
                 <!-- Currently logging in sends the user to the set availability page. In the future, users who are not tutors will be taken to the home page with their name on the top right, while tutors will be taken to this page.-->
                <div>
                <label for="email">Email address</label>
                <input type="email" placeholder="example.email@outlook.com" id="email" name="email"/>
                </div>
                <div>
                <label for="password">Password</label>
                <input type="password" placeholder="********" id="password" name="password"/>
                </div>
                <button type="submit">Log in</button>
            </form>
            <p>Need an account?</p>
            <a href="signup.html">Sign up</a>
        
        </main>
        <footer>
            <p>Ben Myers</p>
            <a href="https://github.com/TheBen2005/startup">Ben's Github</a>
        </footer>

    </body>


</html>
